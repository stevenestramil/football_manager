[project]
name = "football-manager"
version = "0.1.0"
description = "Football manager API"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi[standard]>=0.115",
    "greenlet>=3.5.1",
    "sqlalchemy>=2.0.50",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "httpx2>=2.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
